# Configuration Netlify
# La production (branche master) sert la V2, mise en ligne le 08/08/2026.
# Les anciens fichiers V1 restent dans le dépôt (racine) mais ne sont plus
# publiés : Netlify ne sert que le contenu du dossier "v2".

[build]
  publish = "v2"

[build.environment]
  # Node 18+ pour disposer de fetch() nativement dans les fonctions
  # (netlify/functions/crash-test-inscription.js, appelle l'API Resend),
  # sans dépendance npm à installer.
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[context.deploy-preview]
  publish = "v2"
