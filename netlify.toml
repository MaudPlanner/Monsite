# Configuration Netlify
# La production (branche master) continue de servir la V1 à la racine.
# La branche refonte-site et ses deploy previews servent directement la V2.
# Au moment de la mise en ligne de la V2 : passer publish à "v2" dans [build].

[build]
  publish = "."

[context.refonte-site]
  publish = "v2"

[context.deploy-preview]
  publish = "v2"
