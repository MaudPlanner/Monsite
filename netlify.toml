# Configuration Netlify
# La production (branche master) sert la V2, mise en ligne le 08/08/2026.
# Les anciens fichiers V1 restent dans le dépôt (racine) mais ne sont plus
# publiés : Netlify ne sert que le contenu du dossier "v2".

[build]
  publish = "v2"

[context.deploy-preview]
  publish = "v2"
